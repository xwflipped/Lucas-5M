<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Lucas-5M AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e7eef9;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:16px}section{background:#172339;border:1px solid #31415a;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:23px}h2{font-size:17px}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #4c607a;background:#243650;color:#fff;width:100%}button{background:#2563eb;border:0;font-weight:700}button:disabled{opacity:.5}label{display:block;margin:10px 0 4px;color:#c3d2e7}.muted,small{color:#a8b7ce}.result{font-size:38px;text-align:center;font-weight:800;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wait{color:#e2e8f0}.up{color:#4ade80}.down{color:#fb7185}p{line-height:1.55;overflow-wrap:anywhere}a{color:#93c5fd}summary{cursor:pointer}.row{display:flex;gap:8px}.row button{width:auto;flex:1}</style><main><h1>Lucas-5M · GPT 方向助手</h1><p class="muted">iPad 独立网页 · 只分析，不自动购买 · 证据不足时观望</p><section><h2>下一轮分析</h2><label>目标轮次（本地时间）</label><select id="target"></select><div class="grid"><div><label>币安买涨份额报价</label><input id="up" type="number" min=".01" max=".99" step=".01" placeholder="如 0.51"></div><div><label>币安买跌份额报价</label><input id="down" type="number" min=".01" max=".99" step=".01" placeholder="如 0.50"></div></div><p class="muted">请从币安购买界面手动填写当前报价。报价会变化；不要把旧报价当成可成交价。</p><button id="analyze">GPT 分析目标轮次</button><div class="result wait" id="signal">等待分析</div><p id="reason">请先配置服务地址并填写目标轮次报价。</p><p id="counter" class="muted"></p><p id="info" class="muted"></p><div class="row"><button id="save" disabled>保存模拟信号</button><button id="refresh">刷新轮次</button></div></section><section><details><summary>首次设置 · Cloudflare 服务地址与访问令牌</summary><label>Worker HTTPS 地址</label><input id="endpoint" placeholder="https://lucas-5m-ai.你的子域.workers.dev" autocomplete="off"><label>个人访问令牌（ACCESS_TOKEN）</label><input id="token" type="password" autocomplete="off" placeholder="你在 Worker 后台设置的令牌"><p class="muted">令牌仅保存在当前页面会话，不会提交到 GitHub。关闭浏览器后可能需要重新填写。不要在聊天中发送令牌或 API Key。</p><button id="config">保存当前会话配置</button></details></section><section><h2>本机模拟记录</h2><p id="count" class="muted">0 条</p><div class="row"><button id="export">导出 CSV</button><button id="clear">清空记录</button></div><p class="muted">这里只记录 GPT 当时的建议，不声称自动结算。需要对照币安预测市场的官方结果人工核验。</p></section><p><a href="./">返回主面板</a> · <a href="./backtest90.html">90 天历史回测</a></p></main><script>
"use strict";const $=x=>document.getElementById(x),STEP=300000;let latest=null;let entries=JSON.parse(localStorage.getItem("lucas-ai-records")||"[]");$("endpoint").value=sessionStorage.getItem("lucas-worker")||"";$("token").value=sessionStorage.getItem("lucas-token")||"";
function options(){let now=Date.now(),start=Math.floor(now/STEP)*STEP,sel=$("target").value;$("target").replaceChildren();for(let i=0;i<8;i++){let t=start+i*STEP,o=document.createElement("option");o.value=t;o.textContent=new Date(t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})+" 开始";$("target").append(o)}if([...$("target").options].some(x=>x.value===sel))$("target").value=sel}options();$("refresh").onclick=options;
$("config").onclick=()=>{let u=$("endpoint").value.trim();try{let url=new URL(u);if(url.protocol!=="https:"||url.username||url.password||url.search||url.hash)throw Error();sessionStorage.setItem("lucas-worker",url.origin);sessionStorage.setItem("lucas-token",$("token").value.trim());alert("已保存到当前会话")}catch{alert("请输入正确的 HTTPS Worker 地址")}};
function updateCount(){$("count").textContent=entries.length+" 条模拟信号"}updateCount();
$("analyze").onclick=async()=>{latest=null;$("save").disabled=true;let target=+$("target").value,up=+$("up").value,down=+$("down").value,url=sessionStorage.getItem("lucas-worker"),token=sessionStorage.getItem("lucas-token");if(!url||!token){$("reason").textContent="请展开首次设置，填写 Worker 地址和访问令牌";return}if(!(up>0&&up<1&&down>0&&down<1)){alert("请填写 0 到 1 之间的买涨、买跌报价");return}if(target<Math.floor(Date.now()/STEP)*STEP){$("reason").textContent="轮次已经过期，请刷新";return}let b=$("analyze");b.disabled=true;$("signal").textContent="分析中…";$("reason").textContent="";$("counter").textContent="";$("info").textContent="";try{let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),28000),r;try{r=await fetch(url+"/analyze",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({targetStart:target,upPrice:up,downPrice:down}),signal:ctl.signal})}finally{clearTimeout(timer)}let j=await r.json();if(!r.ok)throw Error(j.error||"HTTP "+r.status);let stale=Date.now()>=target+STEP;let sig=stale?"WAIT":j.recommendation;if(!["UP","DOWN","WAIT"].includes(sig))sig="WAIT";$("signal").textContent=sig==="UP"?"偏向涨":sig==="DOWN"?"偏向跌":"观望";$("signal").className="result "+(sig==="UP"?"up":sig==="DOWN"?"down":"wait");$("reason").textContent=j.reason||"暂无可靠依据";$("counter").textContent=j.counterargument?"反对理由："+j.counterargument:"";$("info").textContent="目标："+new Date(target).toLocaleString()+" · 买涨："+up+" · 买跌："+down+" · 风险："+(j.risk||"未评估")+" · "+(stale?"已过期":"请自行核对当前报价");latest={time:Date.now(),target,up,down,recommendation:sig,reason:j.reason||"",counterargument:j.counterargument||""};$("save").disabled=false}catch(e){$("signal").textContent="观望";$("signal").className="result wait";$("reason").textContent="服务不可用："+e.message}finally{b.disabled=false}};
$("save").onclick=()=>{if(!latest)return;if(entries.some(x=>x.target===latest.target&&x.time===latest.time))return;entries.push(latest);localStorage.setItem("lucas-ai-records",JSON.stringify(entries));updateCount();$("save").disabled=true};
$("clear").onclick=()=>{if(!confirm("清空所有本机 GPT 模拟记录？"))return;entries=[];localStorage.removeItem("lucas-ai-records");updateCount()};
$("export").onclick=()=>{let lines=["timeUTC,targetUTC,upPrice,downPrice,recommendation,reason,counterargument"];for(let x of entries){let v=[new Date(x.time).toISOString(),new Date(x.target).toISOString(),x.up,x.down,x.recommendation,x.reason,x.counterargument];lines.push(v.map(a=>'"'+String(a??"").replaceAll('"','""')+'"').join(","))}let url=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));let a=document.createElement("a");a.href=url;a.download="Lucas-5M-GPT-signals.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></html>
